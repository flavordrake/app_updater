// Java only: no Kotlin plugin to apply, so AGP 9 apps with built-in Kotlin off
// (the Flutter template default) compile it (file_picker 11 did not, 2026-09-27).
group 'dev.flavordrake.app_updater'
version '0.1.0'

apply plugin: 'com.android.library'

android {
    namespace 'dev.flavordrake.app_updater'
    compileSdk 36

    defaultConfig {
        minSdk 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
