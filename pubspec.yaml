name: app_updater
description: Self-update for the fleet's sideloaded Android apps (mobiharness, opsurface). Reads a published latest.json, downloads the APK, verifies its sha256 before it ever touches disk, and hands it to the system installer.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.flavordrake.app_updater
        pluginClass: AppUpdaterPlugin
